<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastest Shipping Lead Apparel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Fastest Shipping Lead Apparel</h1>
        <p>Choose your perfect lead apron with the fastest shipping options.</p>
    </header>

<button onclick="history.back()" style="
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    background-color: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    z-index: 1000;
">
    ← Voltar
</button>

    

    <div class="product-container">
        <div class="product-card">
            <img src="img/slk.jpg" alt="Lead Apron" class="product-image">
            <div class="product-info">
                <p class="product-title">Fastest Shipping Lead Apron</p>

                <div class="size-selection">
                    <label for="size">Choose Size:</label>
                    <select id="size">
                        <option value="small">Small</option>
                        <option value="medium">Medium</option>
                        <option value="large">Large</option>
                        <option value="xl">X-Large</option>
                    </select>
                </div>

                <div class="color-selection">
                    <label for="color">Choose Color:</label>
                    <select id="color">
                        <option value="blue">Blue</option>
                        <option value="green">Teal</option>
                        <option value="black">Black</option>
                        <option value="red">Red</option>
                        <option value="red">Purple</option>
                        <option value="red">Charcal</option>
                    </select>
                </div>

                <button class="buy-button">Buy Now</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Pacific Northwest X-Ray Inc.</p>
    </footer>
</body>
</html>
